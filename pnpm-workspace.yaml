packages:
  - app-nest
  - app-vite

allowBuilds:
  "@parcel/watcher": false
  "@prisma/client": true
  "@prisma/engines": true
  "@swc/core": false
  esbuild: true
  prisma: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - multer@2.3.0
  - "@vitejs/plugin-react@6.1.1"
  - lucide-react@1.35.0 || 1.53.0
  - react-router-dom@7.18.3
  - react-router@7.18.3
  - zod@4.5.1
  - vite@8.3.4

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
